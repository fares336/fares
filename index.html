<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Smart Farm</title>
<style>
:root{--bg:#f3f9f3;--card:#fff;--tx:#17301f;--mu:#5b7262;--pr:#1f6b3a;--lt:#dff1e1;--bd:#cfe3d2;--g:#3fa35c;--y:#e6b422;--r:#d64545;--na:#b9c4bb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b13;--card:#17271c;--tx:#e6f2e8;--mu:#9bb3a1;--pr:#5fc07f;--lt:#1f3626;--bd:#2c4533;--na:#4a5a4e;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1b13;--card:#17271c;--tx:#e6f2e8;--mu:#9bb3a1;--pr:#5fc07f;--lt:#1f3626;--bd:#2c4533;--na:#4a5a4e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif}
header{background:var(--pr);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}header h1{font-size:18px;margin:0;flex:1}
header select,header button{padding:4px 8px;border-radius:6px;border:0}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}nav button{background:none;border:0;padding:10px 14px;color:var(--mu);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}nav button.on{color:var(--pr);border-color:var(--pr);font-weight:600}
main{padding:14px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}.c b{display:block;font-size:20px}.c small{color:var(--mu)}
.tag{font-size:11px;background:var(--lt);color:var(--pr);border-radius:8px;padding:1px 6px}
table{border-collapse:collapse;width:100%}td,th{padding:5px 7px;border-bottom:1px solid var(--bd);text-align:start;font-size:13px}.sc{overflow-x:auto}
input,select{padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);width:100%}label{font-size:12px;color:var(--mu);display:block}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
button.b{background:var(--pr);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer}button.d{background:var(--r)}
#map{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;max-width:560px}#map div{aspect-ratio:1;border-radius:3px;cursor:pointer;border:2px solid transparent}#map div.sel{border-color:var(--tx)}
.g{background:var(--g)}.y{background:var(--y)}.r{background:var(--r)}.na{background:var(--na)}.warn{border-inline-start:4px solid var(--y)}
svg text{fill:var(--mu);font-size:10px}.note{color:var(--mu);font-size:12px}
</style></head><body>
<header><h1>🌱 <span id="ttl"></span><small style="display:block;font-size:12px;font-weight:400;opacity:.9">Fares Hazem Moheb &amp; Mostafa M. El-Shenawy</small></h1><select id="lg" onchange="S.lang=this.value;save();render()"><option value="en">English</option><option value="ar">العربية</option></select><select id="cu" onchange="S.cur=this.value;save();render()"><option>EGP</option><option>USD</option></select></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const CR=`Tomato|طماطم|Solanum lycopersicum|6|6.8|2.5|18|27|600|120|40|80
Wheat|قمح|Triticum aestivum|6|7.5|6|12|22|450|150|3|7
Maize|ذرة|Zea mays|5.8|7|1.7|18|30|600|120|5|10
Potato|بطاطس|Solanum tuberosum|5|6.5|1.7|15|20|500|110|20|40
Date Palm|نخيل البلح|Phoenix dactylifera|7|8.5|4|25|35|1800|365|5|12
Orange|برتقال|Citrus sinensis|6|7.5|1.7|15|30|1000|365|20|45
Grapes|عنب|Vitis vinifera|5.5|7|1.5|15|30|700|365|10|25
Mango|مانجو|Mangifera indica|5.5|7.5|1.5|24|30|1000|365|8|15
Olive|زيتون|Olea europaea|6.5|8|4|15|30|600|365|3|10
Strawberry|فراولة|Fragaria × ananassa|5.5|6.5|1|15|25|450|150|20|40
Rice|أرز|Oryza sativa|5.5|7|3|20|35|1200|140|5|9
Barley|شعير|Hordeum vulgare|6|7.5|8|12|22|400|120|2.5|6
Soybean|فول صويا|Glycine max|6|7|5|20|30|500|120|2|4
Cotton|قطن|Gossypium hirsutum|5.8|8|7.7|20|30|800|180|2.5|4.5
Sunflower|عباد الشمس|Helianthus annuus|6|7.5|4.8|18|27|550|110|2|3.5
Peanut|فول سوداني|Arachis hypogaea|5.9|7|3.2|22|30|500|120|2|4
Onion|بصل|Allium cepa|6|7|1.2|13|24|450|150|25|50
Garlic|ثوم|Allium sativum|6|7.5|1.7|12|24|400|180|8|15
Carrot|جزر|Daucus carota|6|7|1|15|21|450|110|25|50
Cabbage|كرنب|Brassica oleracea|6|7.5|1.8|15|20|400|100|30|60`.split("\n").map((r,i)=>{const a=r.split("|");return{i,en:a[0],ar:a[1],sci:a[2],p0:+a[3],p1:+a[4],ec:+a[5],t0:+a[6],t1:+a[7],w:+a[8],d:+a[9],y0:+a[10],y1:+a[11]}});
const L={ar:{"Smart Farm":"المزرعة الذكية",Dashboard:"لوحة التحكم",Map:"الخريطة",Crops:"المحاصيل","Best Crop":"أفضل محصول",Irrigation:"الري",Fertilizer:"الأسمدة",Finance:"التكاليف والأرباح",Records:"السجلات",Weather:"الطقس",Calendar:"التقويم",Backup:"نسخ احتياطي","Farm area (ha)":"مساحة المزرعة (هكتار)","Zones with data":"مناطق بها بيانات","Avg moisture %":"متوسط الرطوبة %","Avg pH":"متوسط الحموضة","Avg EC dS/m":"متوسط الملوحة dS/m",Temperature:"الحرارة",Humidity:"الرطوبة","Water m³":"المياه م³","Fertilizer kg":"الأسمدة كجم","Total cost":"إجمالي التكاليف","Est. net profit":"صافي الربح التقديري",Alerts:"التنبيهات","No data":"لا توجد بيانات",Save:"حفظ",Delete:"حذف","Soil type":"نوع التربة",Crop:"المحصول","Planting date":"تاريخ الزراعة",Search:"بحث",Score:"الدرجة",Zone:"المنطقة",Date:"التاريخ",Amount:"الكمية",Add:"إضافة","Export CSV":"تصدير CSV",Status:"الحالة","Insufficient data":"بيانات غير كافية","Conventional":"التقليدي","Smart Farm-guided":"بإرشاد المزرعة الذكية","Expected revenue":"الإيراد المتوقع","Actual net profit":"صافي الربح الفعلي",Source:"المصدر","user input":"إدخال المستخدم","Sensors: not connected":"الحساسات: غير متصلة"}};
const S0={lang:"en",cur:"EGP",area:10,thr:30,zones:{},irr:[],fert:[],fin:{},cmp:{conv:{},smart:{}},cp:{},wx:{}};
let S;try{S=Object.assign({},S0,JSON.parse(localStorage.getItem("sf")||"{}"))}catch(e){S=Object.assign({},S0)}
function save(){try{localStorage.setItem("sf",JSON.stringify(S))}catch(e){}}
const t=k=>(L[S.lang]||{})[k]||k, cn=c=>S.lang=="ar"?c.ar:c.en, n=v=>v===""||v==null||isNaN(+v)?null:+v, f=(v,d=1)=>v==null?"—":(+v).toFixed(d);
const sum=a=>a.reduce((x,y)=>x+y,0), avg=a=>a.length?sum(a)/a.length:null, dv=(a,b)=>b?a/b:null;
let tab="Dashboard",sel=null,flt="all";
const TABS=["Dashboard","Map","Crops","Best Crop","Irrigation","Fertilizer","Finance","Records","Weather","Calendar","Backup"];
function st(z){if(!z||z.ph==null||z.ec==null||z.m==null)return"na";if(z.ec>4||z.ph<5||z.ph>8.5||z.m<15)return"r";const c=CR[z.crop];if(z.ec>2||z.ph<6||z.ph>7.5||z.m<S.thr||(c&&sc(z,c).s!=null&&sc(z,c).s<60))return"y";return"g"}
function sc(z,c){const F=[],M=[];let v=[];
if(z.ph==null)M.push("pH");else{const x=z.ph>=c.p0&&z.ph<=c.p1?1:(z.ph>=c.p0-.5&&z.ph<=c.p1+.5?.5:0);v.push(x);F.push(["pH",x])}
if(z.ec==null)M.push("EC");else{const x=z.ec<=c.ec?1:z.ec<=c.ec*1.5?.5:0;v.push(x);F.push(["EC",x])}
const T=n(S.wx.t);if(T==null)M.push("temp");else{const x=T>=c.t0&&T<=c.t1?1:(T>=c.t0-5&&T<=c.t1+5?.5:0);v.push(x);F.push(["Temp",x])}
M.push("N/P/K","water");return{s:z.ph==null||z.ec==null?null:Math.round(avg(v)*100),F,M}}
function alerts(){const w=S.wx,a=[];if(n(w.rain)>=5)a.push("Forecast rain "+w.rain+" mm: planned irrigation may be postponed (prediction, not guaranteed).");if(n(w.t)>=35)a.push("Forecast high temperature: water demand may increase (prediction).");if(n(w.wind)>=40)a.push("Strong wind forecast: caution with spraying/harvest (prediction).");
const Z=Object.values(S.zones);const r=Z.filter(z=>st(z)=="r").length;if(r)a.push(r+" zone(s) show a significant issue in measurements.");const ir=Z.filter(z=>z.m!=null&&z.m<S.thr).length;if(ir)a.push(ir+" zone(s) below the "+S.thr+"% moisture threshold: irrigation may be needed.");return a}
function bars(d,u=""){if(!d.length)return`<p class=note>${t("No data")}</p>`;const m=Math.max(...d.map(x=>x[1]),1),w=Math.max(30,Math.min(60,500/d.length));
return`<div class=sc><svg width="${d.length*w+10}" height="130">${d.map((x,i)=>{const h=x[1]/m*80;return`<rect x="${i*w+5}" y="${95-h}" width="${w-8}" height="${h}" fill="var(--g)" rx=2></rect><text x="${i*w+5}" y="${90-h}">${f(x[1],0)}${u}</text><text x="${i*w+5}" y="112">${String(x[0]).slice(0,7)}</text>`}).join("")}</svg></div>`}
function fin(o){const g=k=>n(o[k])||0,costs=["water","fert","seeds","labor","energy","pest","equip","other"],tc=sum(costs.map(g)),er=g("ey")*g("ep"),ar=g("rev");
const y=g("ay")||g("ey");return{tc,er,ar,en:er-tc,an:ar-tc,em:dv(er-tc,er),am:dv(ar-tc,ar),cu:dv(tc,y)}}
function tag(s){return`<span class=tag>${t(s)}</span>`}
const V={
Dashboard(){const Z=Object.values(S.zones),d=k=>Z.map(z=>z[k]).filter(x=>x!=null),fz=fin(S.fin),w=S.wx,A=alerts();
const h=[];Z.forEach(z=>z.hist.forEach(x=>h.push(x)));h.sort((a,b)=>a.d<b.d?-1:1);
const dist={};Z.forEach(z=>{if(z.crop!=null&&z.crop!=="")dist[CR[z.crop].en]=(dist[CR[z.crop].en]||0)+1});
const C=(l,v,s)=>`<div class=c><small>${t(l)}</small><b>${v}</b>${tag(s||"user input")}</div>`;
return`<div class=grid>${C("Farm area (ha)",`${f(S.area)} ha<br><small>${f(S.area*2.381)} feddan · ${f(S.area*2.471)} acre</small>`)}${C("Zones with data",Z.length+"/256")}${C("Avg moisture %",f(avg(d("m"))))}${C("Avg pH",f(avg(d("ph"))))}${C("Avg EC dS/m",f(avg(d("ec"))))}${C("Temperature",f(n(w.t))+" °C / "+f(n(w.h),0)+"%","user input (manual)")}${C("Water m³",f(sum(S.irr.map(x=>x.v))))}${C("Fertilizer kg",f(sum(S.fert.map(x=>x.kg))))}${C("Total cost",f(fz.tc,0)+" "+S.cur)}${C("Est. net profit",fz.er?f(fz.en,0)+" "+S.cur:"—","estimate")}${C("Alerts",A.length)}</div>
<p class=note>${t("Sensors: not connected")}. 256 zones · ${Z.filter(z=>st(z)!="na").length} assessed.</p>
${A.map(a=>`<div class="c warn">${a}</div>`).join("")}
<div class=c><b style="font-size:15px">${t("Avg moisture %")}</b>${bars(h.filter(x=>x.m!=null).slice(-12).map(x=>[x.d.slice(5),x.m]))}</div>
<div class=c><b style="font-size:15px">${t("Crops")}</b>${bars(Object.entries(dist))}</div>
<div class=c><b style="font-size:15px">${t("Finance")}</b>${bars([["Cost",fz.tc],["Exp.rev",fz.er],["Act.rev",fz.ar]])}</div>`},
Map(){const o=Object.keys(S.zones);let g="";for(let i=0;i<256;i++){const z=S.zones[i];let s=st(z);const c=z&&CR[z.crop];let hide=false;
if(flt=="irr")hide=!(z&&z.m!=null&&z.m<S.thr);if(flt=="sal")hide=!(z&&z.ec!=null&&z.ec>2);if(flt=="miss")hide=!(s=="na");if(flt=="uns")hide=!(c&&sc(z,c).s!=null&&sc(z,c).s<60);
g+=`<div class="${s}${sel===i?" sel":""}" style="${hide?"opacity:.15":""}" title="Z${i+1}" onclick="sel=${i};render()"></div>`}
return`<div class=c><select onchange="flt=this.value;render()" style="max-width:300px"><option value=all>All</option><option value=irr ${flt=="irr"?"selected":""}>${t("Irrigation")}</option><option value=sal ${flt=="sal"?"selected":""}>EC &gt; 2</option><option value=miss ${flt=="miss"?"selected":""}>Missing data</option><option value=uns ${flt=="uns"?"selected":""}>Unsuitable crop</option></select>
<p class=note>🟩 no issue found · 🟨 attention · 🟥 significant issue · ⬜ missing essential data (pH, EC, moisture)</p><div id=map>${g}</div></div>${sel!=null?panel(sel):""}${bulkUI()}`},
Crops(){const q=(window.q||"").toLowerCase();return`<div class=c><input placeholder="${t("Search")}" value="${window.q||""}" oninput="q=this.value;render();document.querySelector('main input').focus()"><p class=note>Generic approximate reference values (FAO-style, temperate-to-arid irrigated production). Not universally applicable: verify with your local agricultural extension service and soil test.</p><div class=sc><table><tr><th>${t("Crop")}<th>Scientific<th>pH<th>EC max<th>°C<th>mm<th>Days<th>t/ha</tr>${CR.filter(c=>(c.en+c.ar+c.sci).toLowerCase().includes(q)).map(c=>`<tr><td>${cn(c)}<td><i>${c.sci}</i><td>${c.p0}–${c.p1}<td>${c.ec}<td>${c.t0}–${c.t1}<td>${c.w}<td>${c.d}<td>${c.y0}–${c.y1}</tr>`).join("")}</table></div></div>`},
"Best Crop"(){const z=S.zones[sel];const ob=window.ob||"A";let r=CR.map(c=>({c,r:z?sc(z,c):null})).filter(x=>x.r&&x.r.s!=null);
const pf=c=>{const p=S.cp[c.i]||{},rv=n(p.p)!=null?(c.y0+c.y1)/2*1000*p.p:null;return rv!=null&&n(p.c)!=null?rv-p.c:null};
const ok=r.filter(x=>x.r.s>=70);const key={A:x=>-x.r.s,B:x=>-(pf(x.c)??-1e12),C:x=>x.c.w}[ob];ok.sort((a,b)=>key(a)-key(b));
return`<div class=c><label>${t("Zone")}</label><select onchange="sel=this.value===''?null:+this.value;render()"><option value="">—</option>${Array.from({length:256},(_,i)=>`<option value=${i} ${sel===i?"selected":""}>Z${i+1}</option>`).join("")}</select><label>Objective</label><select onchange="ob=this.value;render()"><option value=A>A · Highest agronomic suitability</option><option value=B ${ob=="B"?"selected":""}>B · Highest estimated net profit (among suitable)</option><option value=C ${ob=="C"?"selected":""}>C · Lowest water demand (among suitable)</option></select></div>
${!z||r.length==0?`<div class="c warn">${t("Insufficient data")}: pH and EC needed for the selected zone (Map tab). Crops are not ranked without them.</div>`:`<div class="c sc"><table><tr><th>#<th>${t("Crop")}<th>${t("Score")}<th>Factors<th>Missing info<th>mm<th>Net profit (est.)</tr>${ok.map((x,i)=>`<tr><td>${i+1}<td>${cn(x.c)}<td>${x.r.s}<td>${x.r.F.map(a=>a[0]+(a[1]==1?" ✓":a[1]?" ~":" ✗")).join(", ")}<td>${x.r.M.join(", ")}<td>${x.c.w}<td>${f(pf(x.c),0)}</tr>`).join("")}</table><p class=note>Score = share of available factors (pH, EC, temperature) within the crop reference range; not a yield prediction. Suitable: score ≥ 70. ${r.length-ok.length} crop(s) below threshold. Profit is separate from suitability and appears only when you enter prices and costs (Finance tab).</p></div>`}`},
Irrigation(){const Z=Object.entries(S.zones).filter(([i,z])=>z.m!=null||z.crop!=null);return`<div class=c><label>Moisture threshold %</label><input type=number value=${S.thr} onchange="S.thr=+this.value;save();render()" style="max-width:120px"><label>Irrigation water EC (dS/m)</label><input type=number step=0.1 min=0 value="${S.wec||""}" onchange="S.wec=this.value;save();render()" style="max-width:120px"><p class=note>Water salinity is compared with each crop’s EC threshold. The leaching figure uses a rough textbook formula (ECw / (5·ECe − ECw)) with the crop threshold as ECe; confirm with an agronomist.</p><p class=note>Recommendations are indicative, based on your entered moisture and threshold. Estimated amounts require crop stage, soil, and water data not yet entered. No water-saving claims are made without comparison data.</p></div>
<div class="c sc"><table><tr><th>${t("Zone")}<th>${t("Crop")}<th>%<th>Recommendation<th>Water salinity check</tr>${Z.map(([i,z])=>`<tr><td>Z${+i+1}<td>${z.crop!=null&&z.crop!==""?cn(CR[z.crop]):"—"}<td>${f(z.m)}<td>${z.m==null?t("Insufficient data"):z.m<S.thr?"Irrigation may be necessary (below threshold)"+(n(S.wx.rain)>=5?"; forecast rain may reduce need":""):"No irrigation indicated"}<td>${wq(z)}</tr>`).join("")}</table></div>
<div class=c><b style="font-size:15px">Log irrigation (actual)</b><div class=f>${inp("iz","Zone #",1,"number")}${inp("iv","m³",0,"number")}${inp("id","Date","","date")}</div><button class=b onclick="addIrr()">${t("Add")}</button></div>
<div class="c sc"><table>${S.irr.map((x,i)=>`<tr><td>Z${x.z}<td>${x.d}<td>${x.v} m³<td><button class="b d" onclick="del('irr',${i})">✕</button></tr>`).join("")}</table></div>`},
Fertilizer(){return`<div class=c><p class=note>No NPK values or application rates are invented. Enter laboratory soil-test results (N, P, K) per zone to compare against crop needs; until then only your recorded applications and costs are shown.</p><div class=f>${inp("fz","Zone #",1,"number")}${inp("ft","Type","","text")}${inp("fk","kg",0,"number")}${inp("fp","Price/kg",0,"number")}${inp("fd","Date","","date")}</div><button class=b onclick="addF()">${t("Add")}</button></div>
<div class="c sc"><table><tr><th>${t("Zone")}<th>Type<th>kg<th>${S.cur}<th>${t("Date")}<th></tr>${S.fert.map((x,i)=>`<tr><td>Z${x.z}<td>${x.t}<td>${x.kg}<td>${f(x.kg*x.p,0)}<td>${x.d}<td><button class="b d" onclick="del('fert',${i})">✕</button></tr>`).join("")}</table><b>Total: ${f(sum(S.fert.map(x=>x.kg)))} kg · ${f(sum(S.fert.map(x=>x.kg*x.p)),0)} ${S.cur}</b></div>`},
Finance(){const F=[["ey","Expected yield (kg)"],["ep","Expected price/kg"],["ay","Actual yield (kg)"],["rev","Actual revenue"],["water","Water cost"],["fert","Fertilizer cost"],["seeds","Seeds"],["labor","Labor"],["energy","Energy/fuel"],["pest","Pesticide"],["equip","Equipment"],["other","Other"]];
const r=fin(S.fin);const row=(a,b)=>`<tr><td>${a}<td>${b}</tr>`;const cm=["w","f","c","y","r"];const L2={w:"Water m³",f:"Fertilizer kg",c:"Cost "+S.cur,y:"Yield kg",r:"Revenue "+S.cur};
const q=k=>{const o=S.cmp[k],net=(n(o.r)||0)-(n(o.c)||0);return net};
return`<div class=c><label>${t("Farm area (ha)")}</label><input type=number min=0 value=${S.area} onchange="S.area=+this.value||0;save();render()" style="max-width:140px"><div class=f>${F.map(([k,l])=>`<div><label>${l}</label><input type=number min=0 value="${S.fin[k]??""}" onchange="S.fin.${k}=this.value;save();render()"></div>`).join("")}</div>
<table>${row("Total production cost",f(r.tc,0))}${row(t("Expected revenue")+" (est.)",f(r.er,0))}${row("Actual revenue (recorded)",f(r.ar,0))}${row("Estimated net profit",f(r.en,0))}${row(t("Actual net profit"),f(r.an,0))}${row("Margin est. / actual %",f(r.em==null?null:r.em*100)+" / "+f(r.am==null?null:r.am*100))}${row("Cost per kg",f(r.cu,2))}</table><p class=note>Values in ${S.cur}, no currency conversion. Expected ≠ actual. Costs entered are treated as recorded costs.</p></div>
<div class="c sc"><b>${t("Conventional")} vs ${t("Smart Farm-guided")}</b> <span class=note>(enter your own results; no improvement is assumed)</span><table><tr><th><th>${t("Conventional")}<th>${t("Smart Farm-guided")}<th>Δ</tr>${cm.map(k=>`<tr><td>${L2[k]}${["conv","smart"].map(s=>`<td><input type=number value="${S.cmp[s][k]??""}" onchange="S.cmp.${s}.${k}=this.value;save();render()">`).join("")}<td>${n(S.cmp.conv[k])!=null&&n(S.cmp.smart[k])!=null?f(S.cmp.smart[k]-S.cmp.conv[k]):"—"}</tr>`).join("")}<tr><td>Net profit<td>${f(q("conv"),0)}<td>${f(q("smart"),0)}<td>${f(q("smart")-q("conv"),0)}</tr></table></div>
<div class="c sc"><b>Profit-based crop comparison</b> <span class=note>(typical yield mid-point × your price − your cost/ha; estimates)</span><table><tr><th>${t("Crop")}<th>Price/kg<th>Cost/ha<th>Rev/ha<th>Net/ha<th>Water mm<th>Days</tr>${CR.map(c=>{const p=S.cp[c.i]||{},rv=n(p.p)!=null?(c.y0+c.y1)/2*1000*p.p:null;return`<tr><td>${cn(c)}<td><input type=number value="${p.p??""}" onchange="cp(${c.i},'p',this.value)"><td><input type=number value="${p.c??""}" onchange="cp(${c.i},'c',this.value)"><td>${f(rv,0)}<td>${rv!=null&&n(p.c)!=null?f(rv-p.c,0):"—"}<td>${c.w}<td>${c.d}</tr>`}).join("")}</table></div>`},
Records(){const R=[];Object.entries(S.zones).forEach(([i,z])=>z.hist.forEach((h,j)=>R.push({i:+i,j,...h})));R.sort((a,b)=>a.d<b.d?1:-1);
return`<div class=c><button class=b onclick="csv()">${t("Export CSV")}</button> <span class=note>All values are user input; blank = not measured.</span></div><div class="c sc"><table><tr><th>${t("Date")}<th>${t("Zone")}<th>pH<th>EC<th>%<th>°C<th>N<th>P<th>K<th>${t("Source")}<th></tr>${R.map(h=>`<tr><td>${h.d}<td>Z${h.i+1}<td>${f(h.ph)}<td>${f(h.ec)}<td>${f(h.m)}<td>${f(h.t)}<td>${f(h.n)}<td>${f(h.p)}<td>${f(h.k)}<td>${t("user input")}<td><button class="b d" onclick="if(confirm('Delete?')){S.zones[${h.i}].hist.splice(${h.j},1);save();render()}">✕</button></tr>`).join("")}</table></div>`},
Weather(){return`<div class=c><p class=note>Live weather APIs cannot be called from this hosted page, so enter forecast values manually (e.g. from your national weather service). Forecasts are predictions, not guarantees.</p><div class=f>${[["t","Temperature °C"],["h","Humidity %"],["rain","Forecast rain mm"],["wind","Wind km/h"]].map(([k,l])=>`<div><label>${l}</label><input type=number value="${S.wx[k]??""}" onchange="S.wx.${k}=this.value;save();render()"></div>`).join("")}</div>${alerts().map(a=>`<div class="c warn">${a}</div>`).join("")||`<p>${t("No data")}</p>`}</div>
<div class=c><b>Sensors / robot (ESP32)</b><p class=note>${t("Sensors: not connected")}. Planned: sensor readings (moisture, temperature/humidity, pH, EC, GPS) arrive with timestamp, status and validation, then update the matching zone. No robot or irrigation control exists in this version.</p></div>`}};
function wq(z){const c=CR[z.crop],e=n(S.wec);if(!c)return"—";if(e==null)return"Enter water EC";if(e<=c.ec)return"Within crop threshold";const d=5*c.ec-e;return d<=0?"Water too saline for this crop":"Above threshold: extra leaching ≈ "+f(e/d*100,0)+"% (rough)"}
function bulkUI(){return`<div class=c><b>Bulk entry</b><p class=note>Apply the same measured values to a range of zones (for example one uniform field). Enter only values you actually measured.</p><div class=f>${inp("bf","From zone",1,"number")}${inp("bt","To zone",1,"number")}${inp("bph","pH","","number")}${inp("bec","EC dS/m","","number")}${inp("bmo","Moisture %","","number")}</div><button class=b onclick="bulk()">${t("Save")}</button></div>`}
function bulk(){const a=n(bf.value),b=n(bt.value),v={ph:n(bph.value),ec:n(bec.value),m:n(bmo.value)};if(a==null||b==null||a<1||b>256||a>b)return alert("Zone range must be within 1–256");if(Object.values(v).every(x=>x==null))return alert("Enter at least one value");if(v.ph!=null&&(v.ph<3||v.ph>10)||v.m!=null&&(v.m<0||v.m>100))return alert("Check pH (3–10) and moisture (0–100)");if(!confirm("Apply to "+(b-a+1)+" zones?"))return;for(let i=a-1;i<b;i++){const z=S.zones[i]||{hist:[]};const h={d:new Date().toISOString().slice(0,10)};["ph","ec","m"].forEach(k=>{if(v[k]!=null){z[k]=v[k];h[k]=v[k]}});z.hist.push(h);S.zones[i]=z}save();render()}
V.Calendar=function(){const R=Object.entries(S.zones).filter(([i,z])=>z.crop!=null&&z.pd).map(([i,z])=>{const c=CR[z.crop],h=new Date(new Date(z.pd).getTime()+c.d*864e5);const wk=h.getFullYear()+"-W"+String(Math.ceil(((h-new Date(h.getFullYear(),0,1))/864e5+1)/7)).padStart(2,"0");return{i:+i,c,h:h.toISOString().slice(0,10),wk}}).sort((a,b)=>a.h<b.h?-1:1);const cnt={};R.forEach(r=>cnt[r.wk]=(cnt[r.wk]||0)+1);
return`<div class=c><p class=note>Estimated harvest = planting date + typical crop duration (reference value). Real dates depend on variety, weather and management. For perennials (duration 365) this shows an annual cycle only.</p></div>${R.length?`<div class="c sc"><table><tr><th>${t("Zone")}<th>${t("Crop")}<th>${t("Planting date")}<th>Est. harvest<th>Same-week zones</tr>${R.map(r=>`<tr><td>Z${r.i+1}<td>${cn(r.c)}<td>${S.zones[r.i].pd}<td>${r.h}<td>${cnt[r.wk]}${cnt[r.wk]>=10?" ⚠ labor peak":""}</tr>`).join("")}</table></div>`:`<p>${t("No data")}: set crop and planting date on the Map.</p>`}`};
V.Backup=function(){return`<div class=c><b>Backup &amp; restore</b><p class=note>Data is stored only in this browser. Export a JSON file regularly. Importing replaces current data.</p><button class=b onclick="bk()">Export backup (JSON)</button><div class=f><div><label>Import backup</label><input type=file accept=".json" onchange="imp(this)"></div></div></div>`};
function bk(){const a=document.createElement("a");try{a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="smartfarm-backup.json";a.click()}catch(e){alert("Download is not available in this view.")}}
function imp(el){const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.zones!=="object")throw 0;if(!confirm("Replace all current data with this backup?"))return;S=Object.assign({},S0,o);save();render()}catch(e){alert("Invalid backup file")}};r.readAsText(fl)}
function inp(id,l,v,ty){return`<div><label>${l}</label><input id=${id} type=${ty} value="${v}"></div>`}
function cp(i,k,v){S.cp[i]=S.cp[i]||{};S.cp[i][k]=v;save();render()}
function del(k,i){if(confirm("Delete?")){S[k].splice(i,1);save();render()}}
function addIrr(){const v=n(iv.value),z=n(iz.value);if(v==null||v<=0||z<1||z>256||!id.value)return alert("Check zone (1–256), m³ > 0 and date");S.irr.push({z,v,d:id.value});save();render()}
function addF(){const k=n(fk.value),z=n(fz.value);if(k==null||k<=0||z<1||z>256||!fd.value)return alert("Check zone (1–256), kg > 0 and date");S.fert.push({z,t:ft.value||"—",kg:k,p:n(fp.value)||0,d:fd.value});save();render()}
function panel(i){const z=S.zones[i]||{hist:[]};const K=[["ph","pH",0.1],["ec","EC dS/m",0.1],["m","Moisture %",1],["t","Soil °C",1],["n","N mg/kg",1],["p","P mg/kg",1],["k","K mg/kg",1]];const c=CR[z.crop];const r=c?sc(z,c):null;
return`<div class=c><b>${t("Zone")} Z${i+1}</b> <span class="tag ${""}">${st(z)=="na"?t("Insufficient data"):st(z)}</span><div class=f>${K.map(([k,l,s])=>`<div><label>${l}</label><input id=z_${k} type=number step=${s} min=0 value="${z[k]??""}"></div>`).join("")}<div><label>${t("Soil type")}</label><select id=z_soil>${["","Sandy","Loam","Clay","Silty"].map(x=>`<option ${z.soil==x?"selected":""}>${x}</option>`).join("")}</select></div><div><label>${t("Crop")}</label><select id=z_crop><option value="">—</option>${CR.map(x=>`<option value=${x.i} ${z.crop===x.i?"selected":""}>${cn(x)}</option>`).join("")}</select></div><div><label>${t("Planting date")}</label><input id=z_pd type=date value="${z.pd||""}"></div><div><label>Previous crop</label><select id=z_prev><option value="">—</option>${CR.map(x=>`<option value=${x.i} ${z.prev===x.i?"selected":""}>${cn(x)}</option>`).join("")}</select></div></div>
<button class=b onclick="saveZ(${i})">${t("Save")}</button> <button class="b d" onclick="if(confirm('Delete zone data?')){delete S.zones[${i}];save();render()}">${t("Delete")}</button>
<p class=note>pH, EC and moisture are required for a status. Nutrient values are never inferred from pH, moisture or EC; get a lab soil test for N/P/K. ${tag("user input")}</p>
${r?`<p>${cn(c)}: ${r.s==null?t("Insufficient data"):"score "+r.s+" ("+r.F.map(a=>a[0]+(a[1]==1?" ✓":a[1]?" ~":" ✗")).join(", ")+")"}</p>`:""}
${z.m!=null?`<p>${z.m<S.thr?"Irrigation may be necessary: moisture below "+S.thr+"%.":"Moisture above threshold: no irrigation indicated."}</p>`:""}
${z.prev!=null&&z.prev===z.crop?"<p>Same crop as the previous season: rotation is recommended to reduce disease and pest pressure.</p>":""}${z.ec>2?"<p>EC above 2 dS/m: salt-sensitive crops may be affected; consider leaching and a tolerant crop.</p>":""}${z.ph!=null&&(z.ph<5.5||z.ph>8)?"<p>pH outside the common range for most crops: confirm with a lab test.</p>":""}</div>`}
function saveZ(i){const g=k=>n(document.getElementById("z_"+k).value),z=S.zones[i]||{hist:[]};const v={ph:g("ph"),ec:g("ec"),m:g("m"),t:g("t"),n:g("n"),p:g("p"),k:g("k")};
if(v.ph!=null&&(v.ph<3||v.ph>10))return alert("pH must be 3–10");if(v.m!=null&&v.m>100)return alert("Moisture must be 0–100");
const lh=z.hist[z.hist.length-1];if(lh&&lh.m!=null&&v.m!=null&&Math.abs(v.m-lh.m)>40&&!confirm("Moisture changed by more than 40 points since the last reading. Save anyway?"))return;const c=z_crop.value;Object.assign(z,v,{soil:z_soil.value,crop:c===""?null:+c,pd:z_pd.value,prev:z_prev.value===""?null:+z_prev.value});if(Object.values(v).some(x=>x!=null))z.hist.push({d:new Date().toISOString().slice(0,10),...v});S.zones[i]=z;save();render()}
function csv(){const rows=[["date","zone","pH","EC","moisture","soilTemp","N","P","K","source"]];Object.entries(S.zones).forEach(([i,z])=>z.hist.forEach(h=>rows.push([h.d,+i+1,h.ph,h.ec,h.m,h.t,h.n,h.p,h.k,"user input"].map(x=>x??""))));
const a=document.createElement("a");try{a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));a.download="smartfarm.csv";a.click()}catch(e){alert("Download is not available in this view; copy the table instead.")}}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=="ar"?"rtl":"ltr";lg.value=S.lang;cu.value=S.cur;ttl.textContent=t("Smart Farm");
nav.innerHTML=TABS.map(x=>`<button class="${x==tab?"on":""}" onclick="tab='${x}';render()">${t(x)}</button>`).join("");m.innerHTML=V[tab]()}
render();
</script></body></html>
